<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | EST Math</title>
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-container {
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: var(--shadow-xl);
      margin-bottom: 2rem;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    .info-item {
      background: var(--bg-surface);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }
    .info-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .info-value {
      font-weight: 600;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">EST</div>
        <div class="brand-text">
          <span class="brand-title">EST <span>Math</span></span>
          <span class="brand-subtitle">Smart Math with Eyad Mahmoud</span>
        </div>
      </a>
      <nav class="main-nav">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="explanations.html" class="nav-link">Lessons</a></li>
          <li><a href="courses.html" class="nav-link">Courses</a></li>
          <li><a href="consultation.html" class="nav-link">Consultations</a></li>
          <li><a href="ai-exam.html" class="nav-link">AI Exam</a></li>
        </ul>
        <div class="nav-cta"></div>
      </nav>
    </div>
  </header>
  <main class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar" id="avatar">S</div>
        <div>
          <h1 id="profileName" style="margin-bottom: 0.25rem;">Student Profile</h1>
          <p style="color: var(--text-muted);">EST Math Student</p>
        </div>
      </div>
      <div class="info-grid" id="infoGrid"></div>
    </div>
    <div style="text-align: center;">
      <button class="btn btn-outline" onclick="logout()">Logout</button>
    </div>
  </main>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      updateNavAuth();
      if (!checkAuth()) {
        window.location.href = 'login.html';
        return;
      }
      const user = getAuth();
      document.getElementById('avatar').textContent = (user.fullName || 'S').charAt(0).toUpperCase();
      document.getElementById('profileName').textContent = user.fullName || 'Student';
      const grid = document.getElementById('infoGrid');
      grid.innerHTML = `
        <div class="info-item"><div class="info-label">Email</div><div class="info-value">${user.email || '-'}</div></div>
        <div class="info-item"><div class="info-label">Full Name</div><div class="info-value">${user.fullName || '-'}</div></div>
        <div class="info-item"><div class="info-label">Father's Name</div><div class="info-value">${user.fatherName || '-'}</div></div>
        <div class="info-item"><div class="info-label">Student Phone</div><div class="info-value">${user.studentPhone || '-'}</div></div>
        <div class="info-item"><div class="info-label">Father's Phone</div><div class="info-value">${user.fatherPhone || '-'}</div></div>
        <div class="info-item"><div class="info-label">Login Date</div><div class="info-value">${user.loginDate ? new Date(user.loginDate).toLocaleString() : '-'}</div></div>
      `;
    });
  </script>
</body>
</html>
