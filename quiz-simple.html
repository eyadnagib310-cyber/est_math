<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Exam Generator | EST Math</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .container-quiz {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
    }
    .timer {
      background: var(--danger);
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      font-size: 1.8rem;
      font-weight: bold;
      display: inline-block;
      margin: 1rem 0;
    }
    .question {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .opt {
      padding: 0.75rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .opt:hover {
      border-color: var(--primary);
    }
    .opt.selected {
      background: rgba(37,99,235,0.1);
      border-color: var(--primary);
    }
    .opt.correct {
      background: rgba(34,197,94,0.1);
      border-color: var(--success);
    }
    .opt.wrong {
      background: rgba(239,68,68,0.1);
      border-color: var(--danger);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon-box">EST</div>
        <div class="brand-text">
          <span class="brand-title">EST <span>Math</span></span>
          <span class="brand-subtitle">Smart Math with Eyad Mahmoud</span>
        </div>
      </a>
    </div>
  </header>

  <div class="container-quiz">
    <div id="start" class="card">
      <h2>AI Exam Generator</h2>
      <p>EST 2 HS Math Level 1 Jan 2026</p>
      <p style="margin: 2rem 0;">Time: 60 Minutes | Auto Grade on Submit</p>
      <button class="btn btn-primary" onclick="startExam()">Start Exam</button>
    </div>

    <div id="exam" class="hidden">
      <div class="card" style="text-align: center; margin-bottom: 2rem;">
        <h2>EST Math Exam</h2>
        <div class="timer" id="timer">60:00</div>
        <div>Question <span id="qnum">1</span> of <span id="qtotal">0</span></div>
      </div>
      <div id="questions"></div>
      <div style="text-align: center; margin-top: 2rem;">
        <button class="btn btn-outline" onclick="prevQ()">Previous</button>
        <button class="btn btn-outline" onclick="nextQ()">Next</button>
        <button class="btn btn-success" onclick="submitQ()">Submit Exam</button>
      </div>
    </div>

    <div id="result" class="card hidden" style="text-align: center;">
      <h2>Exam Completed</h2>
      <h1 id="score" style="font-size: 4rem; color: var(--primary); margin: 2rem 0;">0%</h1>
      <p>Correct: <span id="corr">0</span> / <span id="tot">0</span></p>
      <p>Grade: <span id="grade">F</span></p>
      <button class="btn btn-primary" onclick="location.reload()">Restart</button>
    </div>
  </div>

  <script src="js/quiz-simple.js"></script>
</body>
</html>
