<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EST Math</title>
  <link rel="icon" type="image/svg+xml" href="images/logo/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(37,99,235,0.05) 0%, transparent 100%);
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-xl);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
    }
    .auth-btn {
      width: 100%;
      padding: 0.875rem;
      margin-top: 1rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1.5rem;">
          <div class="brand-icon-box">EST</div>
          <div class="brand-text">
            <span class="brand-title">EST <span>Math</span></span>
          </div>
        </a>
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Sign in to access your account</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
          <div class="invalid-feedback" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem; display: none;">Please enter a valid email</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
          <div class="invalid-feedback" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem; display: none;">This field is required</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="fatherName">Father's Name</label>
          <input type="text" id="fatherName" class="form-control" placeholder="Enter father's name" required>
          <div class="invalid-feedback" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem; display: none;">This field is required</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="studentPhone">Student Phone Number</label>
          <input type="tel" id="studentPhone" class="form-control" placeholder="Enter student phone number" required>
          <div class="invalid-feedback" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem; display: none;">This field is required</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="fatherPhone">Father's Phone Number</label>
          <input type="tel" id="fatherPhone" class="form-control" placeholder="Enter father's phone number" required>
          <div class="invalid-feedback" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem; display: none;">This field is required</div>
        </div>
        <button type="submit" class="btn btn-primary auth-btn">Login</button>
      </form>
      <div class="auth-footer">
        <a href="index.html">Back to Home</a>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
